<header class="brand-name">
  <a routerLink="/" class="header-link">
    <div class="header-content">
      <img class="logo" src="/assets/logo.png" alt="KoffieBar logo" />
      <div class="header-text">
        <h1>KoffieBar</h1>
        <p>Jouw dagelijkse koffiemoment</p>
      </div>
    </div>
  </a>
  @if (auth.ingelogd()) {
    <button
      type="button"
      class="menu-knop"
      [attr.aria-expanded]="menuOpen()"
      (click)="wisselMenu()"
    >
      <span aria-hidden="true">☰</span> Menu
      @if (mandje.aantalStuks() > 0) {
        <span class="badge">{{ mandje.aantalStuks() }}</span>
      }
    </button>

    <div class="buttons" [class.open]="menuOpen()">
      <button routerLink="/" (click)="sluitMenu()">Home</button>
      <button routerLink="menu" (click)="sluitMenu()">Menu</button>
      <button routerLink="klanten" (click)="sluitMenu()">Klantportaal</button>
      <button routerLink="winkelmandje" (click)="sluitMenu()">
        Winkelmand
        @if (mandje.aantalStuks() > 0) {
          <span class="badge">{{ mandje.aantalStuks() }}</span>
        }
      </button>
      <button (click)="uitloggen()">Uitloggen</button>
    </div>
  }
</header>

<main class="content">
  <router-outlet />
</main>

@if (mandje.melding(); as melding) {
  <div class="toast" role="status" aria-live="polite">{{ melding }}</div>
}
