@if (foutmelding()) {
  <p>{{ foutmelding() }}</p>
} @else if (menu(); as menuData) {
  <h2 id="koffie">Koffie</h2>
  <div class="menu-grid">
    @for (coffee of menuData.coffees; track coffee.id) {
      <app-menu-item
        [item]="coffee"
        [coffeeSizes]="menuData.coffeeSizes"
        [espressoSizes]="menuData.espressoSizes"
        [extras]="menuData.extras"
      />
    }
  </div>

  <h2 id="gebak">Gebak</h2>
  <div class="menu-grid">
    @for (pastry of menuData.pastries; track pastry.id) {
      <app-menu-item [item]="pastry" />
    }
  </div>
} @else {
  <p>Menu laden...</p>
}
